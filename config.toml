# FINA 扣分阈值 — 基于 Edriss et al. 2024 (IJCSS 23/2) 对 Ballet Leg / Barracuda 的研究。
# 论文 Figure 2 & 3 的扣分级联: 0-15° = -0.2, 15-30° = -0.5, >30° = -1.0
[fina]
clean_threshold_deg = 15
minor_deduction_deg = 30
clean_deduction = 0.0
minor_deduction = 0.5
major_deduction = 1.0

[fina.leg_deviation]
clean = 15
minor = 30
major = 30
clean_ded = 0.0
minor_ded = 0.5
major_ded = 1.0

[fina.knee_extension]
# inverted (larger = better): clean >170, minor 155-170, major <155
clean = 170
minor = 155
major = 140
clean_ded = 0.0
minor_ded = 0.3
major_ded = 0.8

[fina.leg_symmetry]
clean = 5
minor = 15
major = 30
clean_ded = 0.0
minor_ded = 0.3
major_ded = 0.6

# Edriss 2024 Finding: r=-0.444 between shoulder-knee angle and total score.
# Upper-body-to-knee alignment matters more than isolated leg metrics.
[fina.shoulder_knee_alignment]
clean = 170
minor = 155
major = 140
clean_ded = 0.0
minor_ded = 0.5
major_ded = 1.0

[fina.trunk_vertical]
clean = 10
minor = 20
major = 35
clean_ded = 0.0
minor_ded = 0.3
major_ded = 0.6

[hardware]
camera_url = "http://192.168.66.105:4747/video"
ble_device_name = "NODE_A1"
ble_char_uuid = "abcd1234-ab12-cd34-ef56-abcdef123456"
imu_nodes = [
    "NODE_A1",
    "NODE_A2",
]
camera_rotation = 270
# Pose detection backend for the LIVE path:
#   "none"      → (default since 2026-07-30, DEVLOG #37) NO live
#                 inference. Live page = camera + IMU only. All vision
#                 runs offline after recording (see [analysis] below) —
#                 heavier models, no real-time budget, better accuracy.
#   "yolo"      → YOLOv8-pose live (legacy; 2-4fps skeleton refresh on
#                 CPU-only machines)
#   "mediapipe" → MediaPipe Pose Landmarker live (legacy fallback)
pose_backend = "none"
# YOLO-specific options (ignored for mediapipe backend):
yolo_model = "yolov8s-pose.pt"    # "yolov8n-pose.pt" (6MB, fast) or "yolov8s-pose.pt" (22MB, more accurate)
yolo_conf = 0.35                   # detection confidence threshold
yolo_device = "mps"                # "mps" (Apple Metal, M-series only), "cuda", or "cpu".
                                   # Intel Mac (e.g. Emily's machine): set "cpu" explicitly —
                                   # mps silently falls back to cpu after a failed warm-up anyway.
                                   # Since 2026-07 preview/recording FPS no longer depends on this
                                   # (inference is decoupled); it only sets skeleton refresh rate.
yolo_imgsz = 640                   # inference resolution. 640 = realtime; 1280 = better small-target recall (~4× cost)
# Minimum per-keypoint confidence. Keypoints below this are zeroed at the
# source (never recorded, never drawn). COCO-pose invents plausible-looking
# coordinates for underwater/occluded joints at conf 0.1-0.4 — Emily's
# 2026-07 dogfood showed those hallucinations rendered as garbage skeletons.
# Raise toward 0.5 to show only very confident joints; lower toward 0 to
# see everything the model emits (debugging).
kpt_min_conf = 0.35
# Phase A optional: path to a custom-trained YOLOv8s DETECTOR (bbox-only,
# trained on swim frames per docs/phase-a-annotation.md). When set, the
# pipeline switches to hybrid mode — custom detector for bboxes (high
# recall on water) + the yolo_model above for keypoints. Leave commented
# out until you've trained one with `python tools/train_detector.py`.
# swimmer_detector = "runs/detect/swimmer_det_v1/weights/best.pt"
# MediaPipe pose model size: "heavy" (30 MB, highest accuracy),
# "full" (10 MB, balanced), or "lite" (6 MB, fastest). Only used when
# pose_backend = "mediapipe".
pose_model_size = "heavy"
# num_poses: how many swimmers to detect simultaneously (1–10). 8 for team
# free routines, 1 for solo.
num_poses = 8
# pose_mode: "video" = fast, smooth, tracks through frames (may fail if face
#            gets occluded since re-detection uses face cues);
#            "image" = every-frame independent detection (slightly jittery
#            but more robust to face occlusion).
pose_mode = "video"
# Detection/tracking confidence thresholds (0.0–1.0).
#   pose_det_conf   = minimum confidence to START a detection
#   pose_pres_conf  = minimum confidence for a detected pose to be kept
#                     (lower = MediaPipe keeps exploring for extra
#                     persons; raise for single-athlete sessions)
#   pose_track_conf = minimum confidence to KEEP tracking across frames
# Defaults tuned for multi-person (num_poses>1) scenarios: looser
# presence so a second swimmer entering frame gets picked up within a
# second or two.
pose_det_conf = 0.4
pose_pres_conf = 0.3
pose_track_conf = 0.3

[hardware.node_placement]
NODE_A1 = "forearm"
NODE_A2 = "shin"

# Offline vision analysis (post-recording, dashboard 分析页 "运行视觉分析"
# button or POST /api/sets/{name}/analyze). This is the ONLY place pose
# inference runs since the 2026-07-30 pivot. Values omitted here fall
# back to [hardware] equivalents (model → yolo_model, device →
# yolo_device, swimmer_detector, kpt_min_conf, max_persons → num_poses).
# Defaults are the dogfood-tuned offline profile (DEVLOG #33):
[analysis]
# conf: omit to use the smart default — 0.35 when a swimmer_detector is
# configured (fine-tuned detector is confident; lower values admit lane
# buoys as false tracks), 0.15 for single-model COCO (water poses
# inherently score low, DEVLOG #33). Uncomment to pin a value:
# conf = 0.35
imgsz = 1280     # 4× cost of 640, catches ankle-only swimmers — fine offline
# Deployed weights live in models/ — a stable, kit-shippable location.
# On a dev machine these are hardlinks into runs/…/weights/; in Emily's
# install they are real files the kit dropped there (DEVLOG #41). Never
# point production config at runs/ directly: that path only exists on the
# machine that did the training.
#
# Phase B swimmer-19 pose weights. v3 (2026-08-04) = 99 crops (旧 53 +
# 新泳池 46). Head-to-head on the same val set (incl. new-pool set_016):
# v2 pose mAP50 0.006 → v3 0.110 (18×). Taken from last.pt deliberately —
# best.pt is picked by box-dominated fitness and its pose head is weaker
# (v3 best 0.055 vs last 0.110). See DEVLOG #38/#39.
model = "models/swimmer_pose19_v3.pt"
# Phase A detector v3 (DEVLOG #40, 2026-08-05): v2 fine-tuned on 150
# old-pool + 46 new-pool frames. Fixes the new pool's red lane-float
# false positives that v2 scored 0.72-0.85 on. Domain-split val:
#   old pool  mAP50 0.842 → 0.880 (no regression)
#   new pool  mAP50 0.493 → 0.867, precision 0.463 → 1.000
# A 40-box visual audit on new-pool footage returned zero false positives
# (v2: the 18 highest-confidence boxes were all floats).
swimmer_detector = "models/swimmer_det_v3.pt"

[dashboard]
default_role = "Coach"
data_dir = "data"
